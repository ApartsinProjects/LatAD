<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 924" width="640" font-family="Helvetica, Arial, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33404d"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="680" height="924" fill="#ffffff"/>

  <!-- Title -->
  <text x="22" y="30" font-size="20" font-weight="700" fill="#1a1a2e">LatAD workflow</text>
  <text x="22" y="50" font-size="12" font-style="italic" fill="#5a4a3a">Subsystem-aware latent detector: per-community VaDE experts, latent surprise heads, and an HC combiner.</text>

  <!-- ===== Input ===== -->
  <g filter="url(#sh)">
    <rect x="180" y="78" width="320" height="56" rx="6" fill="#eef4fa" stroke="#1a4078" stroke-width="1.3"/>
  </g>
  <text x="340" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Window of multivariate telemetry</text>
  <text x="340" y="120" text-anchor="middle" font-size="10" fill="#33404d">then per-channel statistical features</text>

  <line x1="340" y1="134" x2="340" y2="160" stroke="#33404d" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="348" y="152" font-size="9" fill="#5a4a3a">features</text>

  <!-- ===== Correlation-community discovery ===== -->
  <g filter="url(#sh)">
    <rect x="150" y="162" width="380" height="68" rx="6" fill="#f4ecf7" stroke="#722f8a" stroke-width="1.3"/>
  </g>
  <text x="340" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a2e">Correlation-community discovery</text>
  <text x="340" y="204" text-anchor="middle" font-size="10" fill="#33404d">normal-data channel correlation graph,</text>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#33404d">split into subsystems (communities)</text>
  <!-- tag A8 -->
  <rect x="464" y="168" width="58" height="16" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
  <text x="493" y="180" text-anchor="middle" font-size="9.5" font-weight="700" fill="#722f8a">[A8]</text>

  <line x1="340" y1="230" x2="340" y2="278" stroke="#33404d" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="340" y="250" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5a4a3a">fan-out over communities</text>

  <!-- ===== Expert card with ghost copies ===== -->
  <!-- ghosts (behind) -->
  <rect x="94" y="256" width="540" height="360" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2" opacity="0.20"/>
  <rect x="82" y="268" width="540" height="360" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.2" opacity="0.35"/>
  <text x="516" y="278" text-anchor="middle" font-size="9" font-style="italic" fill="#1f4e79">communities G1 … GK</text>

  <!-- main card -->
  <g filter="url(#sh)">
    <rect x="70" y="280" width="540" height="360" rx="8" fill="#f7f9fc" stroke="#1f4e79" stroke-width="1.7"/>
  </g>
  <text x="90" y="303" font-size="12.5" font-weight="700" fill="#1f4e79">Per-community expert  (community G<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>

  <!-- VaDE model -->
  <rect x="200" y="316" width="280" height="46" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.3"/>
  <text x="340" y="335" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">VaDE latent Gaussian-mixture</text>
  <text x="340" y="351" text-anchor="middle" font-size="10" fill="#33404d">model of normal regimes</text>
  <rect x="486" y="330" width="66" height="16" rx="8" fill="#ffffff" stroke="#722f8a" stroke-width="1"/>
  <text x="519" y="342" text-anchor="middle" font-size="9" font-weight="700" fill="#722f8a">[A1/A7]</text>

  <!-- VaDE -> heads (green fan) -->
  <line x1="330" y1="362" x2="150" y2="394" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="335" y1="362" x2="276" y2="394" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="345" y1="362" x2="405" y2="394" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="350" y1="362" x2="531" y2="394" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>

  <!-- Head b1: mixture-density (base) -->
  <rect x="90" y="396" width="114" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.3"/>
  <text x="147" y="416" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a2e">Mixture-density</text>
  <text x="147" y="428" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a2e">head</text>
  <text x="147" y="446" text-anchor="middle" font-size="9" font-weight="700" fill="#722f8a">[A4]</text>
  <text x="147" y="462" text-anchor="middle" font-size="8.5" fill="#33404d">in-support</text>
  <text x="147" y="473" text-anchor="middle" font-size="8.5" fill="#33404d">latent density</text>

  <!-- Head b2: nearest-component NLL (base) -->
  <rect x="219" y="396" width="114" height="90" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.3"/>
  <text x="276" y="416" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">Nearest-component</text>
  <text x="276" y="428" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1a1a2e">NLL</text>
  <text x="276" y="446" text-anchor="middle" font-size="9" font-weight="700" fill="#722f8a">[A6]</text>
  <text x="276" y="462" text-anchor="middle" font-size="8.5" fill="#33404d">rare-regime</text>
  <text x="276" y="473" text-anchor="middle" font-size="8.5" fill="#33404d">safe</text>

  <!-- Head b3: whitened residual (optional / auto-gated) -->
  <rect x="348" y="396" width="114" height="90" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="405" y="414" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">Whitened residual</text>
  <text x="405" y="426" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">head</text>
  <text x="405" y="439" text-anchor="middle" font-size="8.5" font-style="italic" fill="#b3401b">(optional)</text>
  <text x="405" y="455" text-anchor="middle" font-size="8.2" fill="#33404d">gate: held-out-</text>
  <text x="405" y="466" text-anchor="middle" font-size="8.2" fill="#33404d">normal generaliz.</text>

  <!-- Head b4: basin-agreement (optional / auto-gated) -->
  <rect x="477" y="396" width="114" height="90" rx="6" fill="#f0f0f0" stroke="#5a4a3a" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="534" y="414" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">Basin-agreement</text>
  <text x="534" y="426" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1a2e">head</text>
  <text x="534" y="439" text-anchor="middle" font-size="8.5" font-style="italic" fill="#b3401b">[A3]  (optional)</text>
  <text x="534" y="455" text-anchor="middle" font-size="8.2" fill="#33404d">gate: ambiguous-</text>
  <text x="534" y="466" text-anchor="middle" font-size="8.2" fill="#33404d">normal ratio</text>

  <!-- heads -> community surprise (green fan-in) -->
  <line x1="147" y1="486" x2="330" y2="514" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="276" y1="486" x2="336" y2="514" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="405" y1="486" x2="345" y2="514" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>
  <line x1="534" y1="486" x2="351" y2="514" stroke="#1f7a3a" stroke-width="1.1" marker-end="url(#arrG)"/>

  <!-- group labels (drawn on top so text stays legible over the fan-in) -->
  <text x="180" y="505" text-anchor="middle" font-size="9" font-weight="700" fill="#1f7a3a">base heads (always on)</text>
  <text x="500" y="505" text-anchor="middle" font-size="9" font-weight="700" fill="#5a4a3a">auto-gated (optional)</text>

  <rect x="250" y="516" width="180" height="34" rx="6" fill="#eef2f6" stroke="#4a5568" stroke-width="1.2"/>
  <text x="340" y="537" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a1a2e">community surprise</text>

  <!-- demotion note -->
  <rect x="150" y="564" width="380" height="40" rx="6" fill="#fdeee8" stroke="#b3401b" stroke-width="1.1"/>
  <text x="340" y="581" text-anchor="middle" font-size="9.5" fill="#b3401b">Reconstruction is demoted: the residual head is optional / auto-gated.</text>
  <text x="340" y="595" text-anchor="middle" font-size="9.5" fill="#b3401b">The base score is computed in the VaDE latent space.</text>

  <!-- card -> HC -->
  <line x1="340" y1="640" x2="340" y2="710" stroke="#33404d" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="348" y="672" font-size="9" fill="#5a4a3a">per-community</text>
  <text x="348" y="684" font-size="9" fill="#5a4a3a">surprises (K)</text>

  <!-- Global null expert -->
  <g filter="url(#sh)">
    <rect x="70" y="648" width="166" height="46" rx="6" fill="#ecf6ee" stroke="#1f7a3a" stroke-width="1.2"/>
  </g>
  <text x="153" y="668" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Global null expert</text>
  <text x="153" y="683" text-anchor="middle" font-size="8.8" fill="#33404d">dataset-level regimes</text>
  <path d="M 205 694 C 220 706, 235 708, 258 711" fill="none" stroke="#33404d" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- HC combiner -->
  <g filter="url(#sh)">
    <rect x="150" y="712" width="380" height="72" rx="6" fill="#f4f6f8" stroke="#33404d" stroke-width="1.6"/>
  </g>
  <text x="340" y="736" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Cohesion-weighted Higher Criticism (HC)</text>
  <text x="340" y="754" text-anchor="middle" font-size="10" fill="#33404d">combines per-community surprises</text>
  <text x="340" y="770" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5a4a3a">combiner adapts to unknown fault extent</text>

  <!-- HC -> output -->
  <line x1="340" y1="784" x2="340" y2="812" stroke="#33404d" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="348" y="803" font-size="9" fill="#5a4a3a">detector score</text>

  <!-- Output (accent) -->
  <g filter="url(#sh)">
    <rect x="180" y="814" width="320" height="66" rx="7" fill="#eaf1fb" stroke="#1f4e79" stroke-width="1.8"/>
  </g>
  <text x="340" y="844" text-anchor="middle" font-size="13" font-weight="700" fill="#1f4e79">Anomaly score</text>
  <text x="340" y="864" text-anchor="middle" font-size="10.5" fill="#33404d">+ most-surprised community</text>

  <!-- footnote: assumption tag legend -->
  <text x="22" y="900" font-size="9" font-style="italic" fill="#5a4a3a">Tags [A#] mark the MIIM assumption each block realizes:</text>
  <text x="22" y="913" font-size="9" font-style="italic" fill="#5a4a3a">[A8] locality / subsystems · [A1/A7] jointly learned regimes · [A4] mixture density · [A6] rare-regime safe · [A3] auto-gated heads</text>
</svg>
