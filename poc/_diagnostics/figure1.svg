    <text x="64" y="253">0.3</text><text x="64" y="226">0.4</text><text x="64" y="199">0.5</text><text x="64" y="172">0.6</text><text x="64" y="144">0.7</text><text x="64" y="117">0.8</text><text x="64" y="90">0.9</text><text x="64" y="63">1.0</text>
