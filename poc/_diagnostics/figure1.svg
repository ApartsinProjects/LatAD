<figcaption><strong>Figure 1.</strong> Difficult-subset AUROC by method (five-seed mean for the learned detectors). The detector leads the difficult column on every dataset. The margin over the deep detectors (USAD, TranAD) is largest on HAI (0.811 vs 0.45&ndash;0.50) and WADI (0.690 vs 0.30&ndash;0.33), the two benchmarks whose difficult faults break sensor correlations; on SWaT the difficult subset is largely reconstructable, so all methods score highly and the margin is small.</figcaption>
</figure>